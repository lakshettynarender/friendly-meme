name: Den Haag appointment monitor

on:
  schedule:
    - cron: "30 7 * * *"
    - cron: "30 13 * * *"
    - cron: "30 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: appointment-monitor/package-lock.json
      - name: Install monitor dependencies
        working-directory: appointment-monitor
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Check appointment availability
        working-directory: appointment-monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: npm run check
